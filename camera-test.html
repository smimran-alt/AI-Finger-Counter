<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Camera Diagnostic</title><style>body{font:17px system-ui;background:#111827;color:white;padding:16px;max-width:700px;margin:auto}button{font:inherit;padding:13px;margin:7px;border:0;border-radius:10px;background:#53e5a6;color:#071a13}video{display:block;width:100%;min-height:260px;background:#000;object-fit:contain;border-radius:12px}pre{white-space:pre-wrap;word-break:break-word;background:#253247;padding:12px;border-radius:8px}</style></head><body><h2>Camera Test — No AI</h2><p>Open directly in Safari. Tap Start Camera and allow access.</p><video id="preview" autoplay muted playsinline webkit-playsinline></video><p><button id="start">Start Camera</button><button id="switch">Switch Camera</button><button id="stop">Stop</button></p><pre id="status">Ready.</pre><script>
const v=document.getElementById("preview"),s=document.getElementById("status");let stream=null,front=true;
function info(msg){s.textContent=msg+"\nSecure: "+isSecureContext+"\nCamera API: "+Boolean(navigator.mediaDevices?.getUserMedia)+"\nVideo dimensions: "+v.videoWidth+" × "+v.videoHeight+"\nVideo state: "+v.readyState+"\nPaused: "+v.paused}
async function start(){try{stream?.getTracks().forEach(t=>t.stop());v.srcObject=null;info("Requesting permission…");if(!navigator.mediaDevices?.getUserMedia)throw Error("Camera API unavailable. Open HTTPS link in Safari.");stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:front?"user":"environment"},width:{ideal:640},height:{ideal:480}}});v.srcObject=stream;v.muted=true;v.playsInline=true;await v.play();info("Camera stream started. If black, tap Switch Camera.");stream.getVideoTracks()[0].addEventListener("ended",()=>info("Camera track ended."));}catch(e){info("ERROR: "+e.name+": "+e.message)}}
document.getElementById("start").onclick=start;document.getElementById("switch").onclick=()=>{front=!front;start()};document.getElementById("stop").onclick=()=>{stream?.getTracks().forEach(t=>t.stop());v.srcObject=null;info("Stopped")};v.addEventListener("loadedmetadata",()=>info("Video metadata loaded"));v.addEventListener("playing",()=>info("Video playing"));window.addEventListener("pagehide",()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
